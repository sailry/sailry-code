name: Native runtime library
description: Build or restore the pinned Harness native runtime libraries for one target and upload them as a workflow artifact
inputs:
  target:
    description: Target directory name (linux-amd64, linux-arm64, darwin-arm64, darwin-amd64, windows-amd64)
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: native
      with:
        path: .runtime/native/${{ inputs.target }}
        key: code-native-v1-${{ inputs.target }}-${{ hashFiles('.runtime/harness/native/turso/Cargo.toml', '.runtime/harness/native/turso/Cargo.lock', '.runtime/harness/native/turso/rust-toolchain.toml', '.runtime/harness/native/turso/build.sh', '.runtime/harness/native/turso/src/**', '.runtime/harness/native/capture/**', '.runtime/harness/native/windows/crt.ps1') }}
    - name: Pinned Rust toolchain
      if: steps.native.outputs.cache-hit != 'true'
      shell: bash
      working-directory: .runtime/harness/native/turso
      run: rustup toolchain install
    - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
      if: runner.os == 'Linux' && steps.native.outputs.cache-hit != 'true'
      with:
        version: 0.16.0
        use-cache: true
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      if: runner.os == 'Linux' && steps.native.outputs.cache-hit != 'true'
      with:
        path: ~/.cargo/bin/cargo-zigbuild
        key: cargo-zigbuild-v1-${{ runner.os }}-${{ runner.arch }}-0.23.4
    - name: Native libraries
      if: steps.native.outputs.cache-hit != 'true'
      shell: bash
      working-directory: .runtime/harness
      run: |
        set -euo pipefail
        if test "$RUNNER_OS" = Linux; then
          if test ! -x "$HOME/.cargo/bin/cargo-zigbuild"; then
            cargo install cargo-zigbuild --version 0.23.4 --locked
          fi
          export SAILRY_GLIBC=2.34
        fi
        sh native/turso/build.sh
        if test "$RUNNER_OS" != Linux; then sh native/capture/build.sh; fi
    - name: Windows C++ runtime
      if: runner.os == 'Windows' && steps.native.outputs.cache-hit != 'true'
      shell: pwsh
      working-directory: .runtime/harness
      run: ./native/windows/crt.ps1
    - name: Gather native libraries
      if: steps.native.outputs.cache-hit != 'true'
      shell: bash
      working-directory: .runtime/harness
      env:
        TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        cd ".runtime/native/$TARGET"
        case "$RUNNER_OS" in
          Windows)
            set -- turso_sync_sdk_kit.dll sailry-capture.dll windows-crt.json
            while IFS= read -r name; do set -- "$@" "$name"; done < <(jq -r '.files[]' windows-crt.json | tr -d '\r')
            ;;
          macOS) set -- libturso_sync_sdk_kit.dylib libsailry-capture.dylib ;;
          *) set -- libturso_sync_sdk_kit.so ;;
        esac
        output="$GITHUB_WORKSPACE/.runtime/native/$TARGET"
        mkdir -p "$output"
        for name in "$@"; do
          cp "$name" "$output/$name"
          if command -v sha256sum >/dev/null; then sum=$(sha256sum "$name"); else sum=$(shasum -a 256 "$name"); fi
          printf '%s  %s\n' "${sum%% *}" "$name"
        done > "$output/SHA256SUMS"
    - name: Verify native libraries
      shell: bash
      working-directory: .runtime/native/${{ inputs.target }}
      run: |
        set -euo pipefail
        if command -v sha256sum >/dev/null; then sha256sum --check SHA256SUMS; else shasum -a 256 --check SHA256SUMS; fi
        if test "$RUNNER_OS" = Linux; then
          needed=$(objdump -T libturso_sync_sdk_kit.so | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/^GLIBC_//' | sort -V | tail -n 1)
          test "$(printf '%s\n%s\n' "$needed" 2.34 | sort -V | tail -n 1)" = 2.34
        fi
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: code-native-${{ inputs.target }}
        path: .runtime/native/${{ inputs.target }}/
        include-hidden-files: true
        if-no-files-found: error
