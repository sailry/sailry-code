name: Pinned Harness workspace
description: Check out the Harness dependency declared by Code and retain its embedded package resources
outputs:
  revision:
    description: Full Harness source revision
    value: ${{ steps.dependency.outputs.revision }}
runs:
  using: composite
  steps:
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum
    - name: Prepare the pinned Harness workspace
      id: dependency
      shell: bash
      run: |
        set -euo pipefail
        bash dev.sh
        revision=$(git -C .runtime/harness rev-parse --verify HEAD)
        printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
        printf 'GOWORK=%s/.runtime/go.work\nGOTOOLCHAIN=go1.27.3\nCGO_ENABLED=0\nGOFLAGS=-mod=readonly\nSAILRY_HARNESS_DIR=%s/.runtime/harness\n' "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
