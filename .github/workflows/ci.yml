name: Code CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      integration:
        description: Run the repository, SSH, database server and code-index integration suites
        type: boolean
        default: false
  workflow_call:
    inputs:
      distribution:
        description: Build signed distribution packages for the Code release caller
        type: boolean
        default: false
      integration:
        description: Run the repository, SSH, database server and code-index integration suites
        type: boolean
        default: false
    secrets:
      APPLE_CERTIFICATE_P12:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_API_PRIVATE_KEY:
        required: false
      SAILRY_SENTRY_DSN:
        required: false
      SAILRY_TELEMETRY_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: code-ci-${{ github.ref }}-${{ inputs.distribution && 'release' || 'checks' }}
  cancel-in-progress: ${{ !inputs.distribution }}

env:
  GOTOOLCHAIN: go1.27.3
  CGO_ENABLED: '0'
  SAILRY_REVISION: ${{ github.sha }}

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.scope.outputs.go }}
      packages: ${{ steps.scope.outputs.packages }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Changed inputs
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          DISTRIBUTION: ${{ inputs.distribution }}
          INTEGRATION: ${{ inputs.integration }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/ci-scope.sh

  native-linux:
    needs: scope
    if: ${{ inputs.distribution || inputs.integration || needs.scope.outputs.go == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/harness
      - uses: ./.github/actions/native-runtime
        with:
          target: linux-amd64

  checks:
    needs: [scope, native-linux]
    if: ${{ inputs.distribution || inputs.integration || needs.scope.outputs.go == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      SAILRY_TURSO_LIB: ${{ github.workspace }}/.runtime/native/linux-amd64/libturso_sync_sdk_kit.so
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Closed workflow fixtures
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - uses: ./.github/actions/harness
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: code-native-linux-amd64
          path: .runtime/native/linux-amd64
      - name: Verify Go test runtime
        working-directory: .runtime/native/linux-amd64
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          test -f "$SAILRY_TURSO_LIB"
      - name: Format, vet and test the product module
        run: |
          set -euo pipefail
          unset GOROOT
          export GOTOOLCHAIN=go1.27.3 CGO_ENABLED=0
          files=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          test -z "$files" || { printf 'gofmt differs:\n%s\n' "$files" >&2; exit 1; }
          pids=()
          for goos in linux windows darwin; do
            GOOS=$goos go vet -tags integration ./... &
            pids+=($!)
          done
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          test "$status" -eq 0
          go test ./...
      - name: Race detector
        run: |
          set -euo pipefail
          unset GOROOT
          export GOTOOLCHAIN=go1.27.3 CGO_ENABLED=1
          go test -race -p 2 -parallel 4 \
            ./modules/code/code-index/node ./modules/code/ssh/service ./modules/code/databases/service \
            ./modules/code/git/service ./modules/code/terminal/node ./modules/code/worktrees/node

  integration:
    needs: native-linux
    if: inputs.integration || inputs.distribution
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sailry_ci
          POSTGRES_USER: sailry
          POSTGRES_PASSWORD: ci-postgres-fixture
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U sailry -d sailry_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sailry_ci
          MYSQL_USER: sailry
          MYSQL_PASSWORD: ci-mysql-fixture
          MYSQL_ROOT_PASSWORD: ci-root-fixture
        ports:
          - 3306/tcp
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pci-root-fixture"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      SAILRY_TURSO_LIB: ${{ github.workspace }}/.runtime/native/linux-amd64/libturso_sync_sdk_kit.so
      SAILRY_TEST_POSTGRES_HOST: 127.0.0.1
      SAILRY_TEST_POSTGRES_DATABASE: sailry_ci
      SAILRY_TEST_POSTGRES_USERNAME: sailry
      SAILRY_TEST_POSTGRES_PASSWORD: ci-postgres-fixture
      SAILRY_TEST_POSTGRES_TLS: disable
      SAILRY_TEST_MYSQL_HOST: 127.0.0.1
      SAILRY_TEST_MYSQL_DATABASE: sailry_ci
      SAILRY_TEST_MYSQL_USERNAME: sailry
      SAILRY_TEST_MYSQL_PASSWORD: ci-mysql-fixture
      SAILRY_TEST_MYSQL_TLS: disable
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/harness
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: code-native-linux-amd64
          path: .runtime/native/linux-amd64
      - name: Verify integration runtime
        working-directory: .runtime/native/linux-amd64
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          test -f "$SAILRY_TURSO_LIB"
      - name: SSH, database and code-index integration tests
        env:
          SAILRY_TEST_POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
          SAILRY_TEST_MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: |
          set -euo pipefail
          unset GOROOT
          export GOTOOLCHAIN=go1.27.3 CGO_ENABLED=0
          go test -p 1 -timeout 20m -tags integration \
            ./modules/code/ssh/service ./modules/code/databases/service ./modules/code/code-index/node ./internal/assembly/codehost

  repository-integration:
    needs: [native-linux, native]
    if: inputs.integration || inputs.distribution
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-amd64, turso: libturso_sync_sdk_kit.so }
          - { os: macos-15, target: darwin-arm64, turso: libturso_sync_sdk_kit.dylib }
          - { os: windows-2025, target: windows-amd64, turso: turso_sync_sdk_kit.dll }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      SAILRY_TURSO_LIB: ${{ github.workspace }}/.runtime/native/${{ matrix.target }}/${{ matrix.turso }}
    steps:
      - name: Repository line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/harness
      - name: Linux command sandbox
        if: runner.os == 'Linux'
        run: bash "$SAILRY_HARNESS_DIR/.github/scripts/setup-linux-command-sandbox.sh"
      - name: Prepare the pinned Go module cache
        run: |
          unset GOROOT
          go mod download
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: code-native-${{ matrix.target }}
          path: .runtime/native/${{ matrix.target }}
      - name: Verify repository test runtime
        working-directory: .runtime/native/${{ matrix.target }}
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null; then
            sha256sum --check SHA256SUMS
          else
            shasum -a 256 --check SHA256SUMS
          fi
          test -f "$SAILRY_TURSO_LIB"
      - name: Git engine and Node module integration tests
        run: |
          set -euo pipefail
          unset GOROOT
          export GOPROXY=off
          packages=(./modules/code/git/service)
          if [ "$RUNNER_OS" = Linux ]; then
            packages+=(./modules/code/git/node ./modules/code/worktrees/node)
          fi
          go test -p 1 -timeout 20m -tags integration "${packages[@]}"

  native:
    needs: scope
    if: ${{ inputs.distribution || inputs.integration || needs.scope.outputs.packages == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-15, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-amd64 }
          - { os: windows-2025, target: windows-amd64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Repository line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/harness
      - uses: ./.github/actions/native-runtime
        with:
          target: ${{ matrix.target }}

  platform-tests:
    needs: [scope, native]
    if: ${{ inputs.distribution || inputs.integration || needs.scope.outputs.packages == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: darwin-arm64, turso: libturso_sync_sdk_kit.dylib }
          - { os: windows-2025, target: windows-amd64, turso: turso_sync_sdk_kit.dll }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      SAILRY_TURSO_LIB: ${{ github.workspace }}/.runtime/native/${{ matrix.target }}/${{ matrix.turso }}
    steps:
      - name: Repository line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/harness
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: code-native-${{ matrix.target }}
          path: .runtime/native/${{ matrix.target }}
      - name: Verify platform test runtime
        working-directory: .runtime/native/${{ matrix.target }}
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null; then
            sha256sum --check SHA256SUMS
          else
            shasum -a 256 --check SHA256SUMS
          fi
          test -f "$SAILRY_TURSO_LIB"
      - name: Platform-sensitive Go tests
        run: |
          set -euo pipefail
          unset GOROOT
          export GOTOOLCHAIN=go1.27.3 CGO_ENABLED=0
          go test -p 1 -timeout 20m \
            ./modules/code/code-index/node ./modules/code/git/service \
            ./modules/code/databases/service ./modules/code/terminal/node

  macos:
    needs: [scope, checks, native]
    if: ${{ inputs.distribution || needs.scope.outputs.packages == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: darwin-arm64, triple: aarch64-apple-darwin }
          - { os: macos-15-intel, target: darwin-amd64, triple: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      SAILRY_SIGNING: ${{ inputs.distribution && 'developer-id' || 'ad-hoc' }}
      SAILRY_NOTARIZE: ${{ inputs.distribution && '1' || '0' }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
      SAILRY_SENTRY_DSN: ${{ inputs.distribution && secrets.SAILRY_SENTRY_DSN || '' }}
      SAILRY_TELEMETRY_KEY: ${{ inputs.distribution && secrets.SAILRY_TELEMETRY_KEY || '' }}
      SAILRY_RUST_LICENSES_CACHE: ${{ github.workspace }}/.runtime/licenses/turso-${{ matrix.triple }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/harness
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: licenses
        with:
          path: .runtime/licenses/turso-${{ matrix.triple }}
          key: code-turso-licenses-v1-${{ matrix.triple }}-${{ hashFiles('.runtime/harness/native/turso/Cargo.toml', '.runtime/harness/native/turso/Cargo.lock', '.runtime/harness/internal/node/host/deployment/dependencies.jq', '.runtime/harness/internal/node/host/deployment/licenses.sh') }}
      - name: Pinned Rust toolchain for notices
        if: steps.licenses.outputs.cache-hit != 'true'
        working-directory: .runtime/harness/native/turso
        run: rustup toolchain install
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: code-native-${{ matrix.target }}
          path: ${{ runner.temp }}/native
      - name: Code signing credentials
        if: inputs.distribution
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE_P12" && test -n "$APPLE_CERTIFICATE_PASSWORD" && test -n "$APPLE_API_PRIVATE_KEY" ||
            { echo 'The Code macOS signing secrets are not configured' >&2; exit 1; }
          umask 077
          certificate=$RUNNER_TEMP/code-signing.p12
          key=$RUNNER_TEMP/code-notary.p8
          keychain=$RUNNER_TEMP/code-signing.keychain-db
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$certificate"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          rm -f -- "$certificate"
          printf 'APPLE_SIGNING_KEYCHAIN=%s\nAPPLE_API_KEY_PATH=%s\n' "$keychain" "$key" >> "$GITHUB_ENV"
      - name: Code Desktop and Host
        env:
          TARGET: ${{ matrix.target }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          bash cmd/sailry-code-desktop/macos/package.sh -artifacts "$RUNNER_TEMP/native"
          bash cmd/sailry-code-host/package.sh -artifacts "$RUNNER_TEMP/native"
          mkdir -p .runtime/release
          cp ".runtime/package/out/$TARGET/Sailry-$TRIPLE.dmg" ".runtime/package/out/$TARGET/Sailry-$TRIPLE-unsigned.zip" \
            ".runtime/host/$TRIPLE/sailry-host-$TRIPLE.tar.gz" ".runtime/host/$TRIPLE/SHA256SUMS-$TRIPLE" .runtime/release/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.distribution
        with:
          name: code-macos-${{ matrix.triple }}
          path: .runtime/release/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
      - name: Remove Code signing credentials
        if: always() && inputs.distribution
        run: |
          keychain=$RUNNER_TEMP/code-signing.keychain-db
          if test -e "$keychain"; then security delete-keychain "$keychain"; fi
          rm -f -- "$RUNNER_TEMP/code-signing.p12" "$RUNNER_TEMP/code-notary.p8"

  windows:
    needs: [scope, checks, native]
    if: ${{ inputs.distribution || needs.scope.outputs.packages == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      SAILRY_SENTRY_DSN: ${{ inputs.distribution && secrets.SAILRY_SENTRY_DSN || '' }}
      SAILRY_TELEMETRY_KEY: ${{ inputs.distribution && secrets.SAILRY_TELEMETRY_KEY || '' }}
      SAILRY_RUST_LICENSES_CACHE: ${{ github.workspace }}/.runtime/licenses/turso-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/harness
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: licenses
        with:
          path: .runtime/licenses/turso-x86_64-pc-windows-msvc
          key: code-turso-licenses-v1-x86_64-pc-windows-msvc-${{ hashFiles('.runtime/harness/native/turso/Cargo.toml', '.runtime/harness/native/turso/Cargo.lock', '.runtime/harness/internal/node/host/deployment/dependencies.jq', '.runtime/harness/internal/node/host/deployment/licenses.sh') }}
      - name: Pinned Rust toolchain for notices
        if: steps.licenses.outputs.cache-hit != 'true'
        working-directory: .runtime/harness/native/turso
        run: rustup toolchain install
      - name: NSIS
        run: |
          sudo apt-get update -o Acquire::Languages=none
          sudo apt-get install --no-install-recommends --yes nsis
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: code-native-windows-amd64
          path: ${{ runner.temp }}/native
      - name: Code Desktop
        run: |
          set -euo pipefail
          bash cmd/sailry-code-desktop/windows/package.sh -artifacts "$RUNNER_TEMP/native"
          mkdir -p .runtime/release
          cp .runtime/package/out/windows-amd64/Sailry-x86_64-pc-windows-msvc-setup.exe \
            .runtime/package/out/windows-amd64/Sailry-x86_64-pc-windows-msvc.zip .runtime/release/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.distribution
        with:
          name: code-windows
          path: .runtime/release/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0

  host-linux:
    needs: [scope, checks, native-linux, native]
    if: ${{ inputs.distribution || needs.scope.outputs.packages == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-amd64, triple: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: linux-arm64, triple: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      SAILRY_SENTRY_DSN: ${{ inputs.distribution && secrets.SAILRY_SENTRY_DSN || '' }}
      SAILRY_TELEMETRY_KEY: ${{ inputs.distribution && secrets.SAILRY_TELEMETRY_KEY || '' }}
      SAILRY_RUST_LICENSES_CACHE: ${{ github.workspace }}/.runtime/licenses/turso-${{ matrix.triple }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/harness
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: licenses
        with:
          path: .runtime/licenses/turso-${{ matrix.triple }}
          key: code-turso-licenses-v1-${{ matrix.triple }}-${{ hashFiles('.runtime/harness/native/turso/Cargo.toml', '.runtime/harness/native/turso/Cargo.lock', '.runtime/harness/internal/node/host/deployment/dependencies.jq', '.runtime/harness/internal/node/host/deployment/licenses.sh') }}
      - name: Pinned Rust toolchain for notices
        if: steps.licenses.outputs.cache-hit != 'true'
        working-directory: .runtime/harness/native/turso
        run: rustup toolchain install
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: code-native-${{ matrix.target }}
          path: ${{ runner.temp }}/native
      - name: Code Host
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          bash cmd/sailry-code-host/package.sh -artifacts "$RUNNER_TEMP/native"
          mkdir -p .runtime/release
          cp ".runtime/host/$TRIPLE/sailry-host-$TRIPLE.tar.gz" ".runtime/host/$TRIPLE/SHA256SUMS-$TRIPLE" .runtime/release/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.distribution
        with:
          name: code-host-${{ matrix.triple }}
          path: .runtime/release/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
