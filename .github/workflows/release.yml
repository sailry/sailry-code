name: Code Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: go1.27.3
  CGO_ENABLED: '0'

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      mobile_build: ${{ steps.version.outputs.mobile_build }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Code tag, product and mobile metadata agree
        id: version
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          [[ $GITHUB_REF_NAME =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]] ||
            { echo 'The tag must be a release version (v<Version>)' >&2; exit 1; }
          version=${BASH_REMATCH[1]}
          product=$(sed -nE 's/^[[:space:]]*(const[[:space:]]+)?Version[[:space:]]*=[[:space:]]*"([^"]*)".*$/\2/p' internal/product/*.go)
          id=$(sed -nE 's/^[[:space:]]*(const[[:space:]]+)?ID[[:space:]]*=[[:space:]]*"([^"]*)".*$/\2/p' internal/product/*.go)
          desktop=$(jq -er .version cmd/sailry-code-desktop/mygo.json)
          test "$id" = code && test "$product" = "$version" && test "$desktop" = "$version" ||
            { echo 'The Code tag, product identity and Desktop metadata differ' >&2; exit 1; }
          mobile=$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+)[[:space:]]*$/\1/p' apps/mobile/pubspec.yaml)
          mobile_build=${mobile#*+}
          test "${mobile%+*}" = "$version" && [[ $mobile_build =~ ^[1-9][0-9]*$ ]] ||
            { echo 'The Mobile version must match the Code tag with a positive build number' >&2; exit 1; }
          printf 'version=%s\nmobile_build=%s\n' "$version" "$mobile_build" >> "$GITHUB_OUTPUT"

  packages:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      distribution: true
    secrets:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      SAILRY_SENTRY_DSN: ${{ secrets.SAILRY_SENTRY_DSN }}
      SAILRY_TELEMETRY_KEY: ${{ secrets.SAILRY_TELEMETRY_KEY }}

  mobile:
    needs: version
    uses: ./.github/workflows/mobile.yml
    with:
      release_version: ${{ needs.version.outputs.version }}
      release_build: ${{ needs.version.outputs.mobile_build }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}

  draft:
    needs: [version, packages, mobile]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/harness
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: 'code-{macos-*,windows,host-*}'
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: 'code-mobile-{android,ios}'
          path: ${{ runner.temp }}/mobile
          merge-multiple: true
      - name: Mobile packages and checksums
        working-directory: ${{ runner.temp }}/assets
        run: |
          set -euo pipefail
          apk=Sailry-android-arm64.apk
          ipa=Sailry-ios.ipa
          test -s "../mobile/$apk" && test -s "../mobile/$ipa" ||
            { echo 'The Code draft requires both signed mobile packages from this run' >&2; exit 1; }
          mv "../mobile/$apk" "../mobile/$ipa" .
          sha256sum "$apk" "$ipa" > SHA256SUMS-mobile
      - name: Code update feed
        working-directory: ${{ runner.temp }}/assets
        env:
          SAILRY_UPDATE_SIGNING_KEY: ${{ secrets.SAILRY_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          unset GOROOT
          export GOTOOLCHAIN=go1.27.3 CGO_ENABLED=0
          mkdir ../unsigned
          mv Sailry-aarch64-apple-darwin-unsigned.zip Sailry-x86_64-apple-darwin-unsigned.zip \
            Sailry-x86_64-pc-windows-msvc.zip ../unsigned/
          go -C "$GITHUB_WORKSPACE" run ./cmd/update-feed -version "$VERSION" -output "$PWD" \
            "aarch64-apple-darwin=$RUNNER_TEMP/unsigned/Sailry-aarch64-apple-darwin-unsigned.zip" \
            "x86_64-apple-darwin=$RUNNER_TEMP/unsigned/Sailry-x86_64-apple-darwin-unsigned.zip" \
            "x86_64-pc-windows-msvc=$RUNNER_TEMP/unsigned/Sailry-x86_64-pc-windows-msvc.zip"
      - name: Checksums and Code Host installer
        working-directory: ${{ runner.temp }}/assets
        run: |
          set -euo pipefail
          tar -xOf sailry-host-x86_64-unknown-linux-gnu.tar.gz ./install-host.sh > install-host.sh
          grep -Fxq 'task_repository=https://github.com/sailry/sailry-code' install-host.sh
          sha256sum install-host.sh > SHA256SUMS-installer
          for triple in aarch64-apple-darwin x86_64-apple-darwin; do
            sha256sum "Sailry-$triple.dmg" "Sailry-$triple.zip" "Sailry-$triple.zip.update.json" > "SHA256SUMS-desktop-$triple"
          done
          triple=x86_64-pc-windows-msvc
          sha256sum "Sailry-$triple-setup.exe" "Sailry-$triple.zip" "Sailry-$triple.zip.update.json" > "SHA256SUMS-desktop-$triple"
          sha256sum --check SHA256SUMS-aarch64-apple-darwin SHA256SUMS-x86_64-apple-darwin \
            SHA256SUMS-aarch64-unknown-linux-gnu SHA256SUMS-x86_64-unknown-linux-gnu
      - name: Gather a draft without replacing historical assets
        working-directory: ${{ runner.temp }}/assets
        env:
          MOBILE_BUILD: ${{ needs.version.outputs.mobile_build }}
        run: |
          set -euo pipefail
          tag=$GITHUB_REF_NAME
          if ! gh release view "$tag" >/dev/null 2>&1; then
            options=(--draft --verify-tag --title "Sailry Code $VERSION" --generate-notes)
            case "$VERSION" in *-*) options+=(--prerelease) ;; esac
            gh release create "$tag" "${options[@]}"
          fi
          release=$(gh release view "$tag" --json databaseId,isDraft)
          test "$(jq -r .isDraft <<<"$release")" = true || { echo "$tag is already published; its assets stay unchanged" >&2; exit 1; }
          gh api --paginate "repos/$GH_REPO/releases/$(jq -r .databaseId <<<"$release")/assets" \
            --jq '.[] | [.name, .state, (.digest // ""), (.label // "")] | @tsv' > ../existing.tsv
          # The mobile job verified the signed APK against this build number.
          apk_label="Android build $MOBILE_BUILD"
          upload=()
          for file in *; do
            row=$(awk -F '\t' -v name="$file" '$1 == name' ../existing.tsv)
            if test -z "$row"; then
              case "$file" in
                Sailry-android-arm64.apk) upload+=("$file#$apk_label") ;;
                *) upload+=("$file") ;;
              esac
              continue
            fi
            sum=$(sha256sum "$file")
            test "${row%$'\t'*}" = "$(printf '%s\tuploaded\tsha256:%s' "$file" "${sum%% *}")" ||
              { echo "$file already exists with other content" >&2; exit 1; }
            if test "$file" = Sailry-android-arm64.apk; then
              test "${row##*$'\t'}" = "$apk_label" ||
                { echo "$file already exists with a different label (expected $apk_label)" >&2; exit 1; }
            fi
          done
          if test ${#upload[@]} -gt 0; then gh release upload "$tag" "${upload[@]}"; fi
